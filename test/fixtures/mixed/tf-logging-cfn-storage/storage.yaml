AWSTemplateFormatVersion: '2010-09-09'
Description: Log storage for the Bedrock invocation logging declared in main.tf.

Resources:
  LogBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: mixed-ai-logs
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: retain-one-year
            Status: Enabled
            ExpirationInDays: 365

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/bedrock/mixed
      RetentionInDays: 365
